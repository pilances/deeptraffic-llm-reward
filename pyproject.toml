[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptraffic-llm-reward"
version = "0.4.0"
description = "A reproducible Gymnasium reimplementation scaffold for MIT DeepTraffic"
requires-python = ">=3.9"
dependencies = [
  "gymnasium>=0.29,<2",
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

